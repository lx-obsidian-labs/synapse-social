name: Synapse MCP Companion CI
on:
  pull_request:
    paths:
      - 'apps/mcp-companion/**'
      - '.github/workflows/synapse-mcp-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mcp-companion/**'
      - '.github/workflows/synapse-mcp-ci.yml'
permissions:
  contents: read
jobs:
  companion-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check apps/mcp-companion/index.mjs
          node --check apps/mcp-companion/providers.mjs
          node --check apps/mcp-companion/skills.mjs
      - name: Provider and skill catalogue tests
        run: node --test apps/mcp-companion/catalog.test.mjs
