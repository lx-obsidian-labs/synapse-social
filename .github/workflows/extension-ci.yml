name: Synapse Extension CI
on:
  push:
    paths:
      - 'apps/extension/**'
      - '.github/workflows/extension-ci.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/extension/**'
      - '.github/workflows/extension-ci.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Read extension version
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'EXT_VERSION=' + require('./manifest.json').version + '\n')"
      - name: Check runtime versions
        run: |
          node --version
          npm --version
          python3 --version
      - name: Run deterministic browser-flow tests
        run: npm test
      - name: Build and package extension
        env:
          SUPABASE_PROXY_URL: https://fvfrbxyrlonmucyvzppk.supabase.co/functions/v1/nvidia-proxy
        run: npm run zip
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Test real extension UI
        run: npm run test:ui
      - name: Validate package
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/manifest.json'));for(const x of ['background.js','content.js','sidepanel.js','shell.js','browser-flow.js','popup.js','sidepanel.html','popup.html','skills.js','skills-ui.js','obsidian.css','orchestration.js','retrieval.js','updates-ui.js'])if(!fs.existsSync('dist/'+x))throw Error('Missing '+x);if(m.version!==process.env.EXT_VERSION)throw Error('Version mismatch')"
      - name: Verify ZIP structure and integrity
        run: |
          set -euo pipefail
          archive="synapse-ai-v${EXT_VERSION}-test.zip"
          test -s "$archive"
          unzip -t "$archive"
          for file in manifest.json background.js content.js sidepanel.html sidepanel.js browser-flow.js shell.js popup.html popup.js skills.js skills-ui.js obsidian.css orchestration.js retrieval.js updates-ui.js; do
            unzip -Z1 "$archive" | grep -Fxq "$file" || { echo "::error::ZIP missing root-level $file"; exit 1; }
          done
          echo 'Extension ZIP verified: manifest and runtime files are at the archive root.'
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-ai-v${{ env.EXT_VERSION }}-test
          path: apps/extension/synapse-ai-v${{ env.EXT_VERSION }}-test.zip
          retention-days: 7

      - name: Package experimental MCP companion
        working-directory: .
        run: |
          set -euo pipefail
          test -s apps/mcp-companion/index.mjs
          test -s apps/mcp-companion/package.json
          node --check apps/mcp-companion/index.mjs
          cd apps/mcp-companion
          zip -j ../../synapse-mcp-companion-test.zip package.json index.mjs
          cd ../..
          unzip -t synapse-mcp-companion-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-mcp-companion-test
          path: synapse-mcp-companion-test.zip
          retention-days: 7

      - name: Publish test prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${EXT_VERSION}-test"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Synapse AI ${EXT_VERSION} — Test build" --notes "Chat-first interface with Chat, Tools and Settings only. In-app update checks, newer-release download notices and correct installed-version display in the popup. Direct-reply routing, bounded browser orchestration, observed-link search recovery, Chrome download-state verification and session-local lexical page retrieval. Unpacked updates require replacing files and reloading the extension. Skills are in Tools; external runtimes are not bundled." --prerelease
          gh release upload "$tag" "synapse-ai-v${EXT_VERSION}-test.zip" ../../synapse-mcp-companion-test.zip --repo "$GITHUB_REPOSITORY" --clobber
