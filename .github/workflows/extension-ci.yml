name: Synapse Extension CI
on:
  push:
    paths:
      - 'apps/extension/**'
      - '.github/workflows/extension-ci.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/extension/**'
      - '.github/workflows/extension-ci.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check runtime versions
        run: |
          node --version
          npm --version
          python3 --version
      - name: Build and package extension
        run: npm run zip
      - name: Validate package
        run: |
          node -e "const fs=require('fs');const p='dist/manifest.json';const m=JSON.parse(fs.readFileSync(p));for(const x of ['background.js','content.js','sidepanel.js','shell.js','popup.js','sidepanel.html','popup.html'])if(!fs.existsSync('dist/'+x))throw Error('Missing '+x);if(m.version!=='1.2.0')throw Error('Version mismatch')"
      - name: Verify ZIP structure and integrity
        run: |
          set -euo pipefail
          test -s synapse-ai-v1.2.0-test.zip
          unzip -t synapse-ai-v1.2.0-test.zip
          for file in manifest.json background.js content.js sidepanel.html sidepanel.js shell.js popup.html popup.js; do
            unzip -Z1 synapse-ai-v1.2.0-test.zip | grep -Fxq "$file" || { echo "::error::ZIP missing root-level $file"; exit 1; }
          done
          echo 'Extension ZIP verified: manifest and runtime files are at the archive root.'
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-ai-v1.2.0-test
          path: apps/extension/synapse-ai-v1.2.0-test.zip
          retention-days: 7

      - name: Publish test prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2.0-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v1.2.0-test --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Synapse AI 1.2.0 — Test build" --notes "Early testing build. Install manually and send usage logs. MCP and AI integration are experimental." --prerelease
          gh release upload v1.2.0-test synapse-ai-v1.2.0-test.zip --repo "$GITHUB_REPOSITORY" --clobber
