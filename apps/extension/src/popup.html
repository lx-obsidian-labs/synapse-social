<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synapse AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #FFFFFF; color: #050505; }
    .header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #E4E6EB; }
    .logo { width: 32px; height: 32px; background: linear-gradient(135deg, #6366F1, #8B5CF6); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }
    .header h1 { font-size: 15px; font-weight: 600; flex: 1; }
    .status { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #65676B; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #42B72A; }
    .body { padding: 12px; }
    .card { display: flex; align-items: center; gap: 10px; padding: 10px; background: #F0F2F5; border-radius: 8px; margin-bottom: 12px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #E4E6EB; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #65676B; }
    .card .info { flex: 1; }
    .card .name { font-size: 13px; font-weight: 600; }
    .card .sub { font-size: 11px; color: #65676B; }
    .btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 14px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; text-align: left; }
    .btn-primary { background: #6366F1; color: white; }
    .btn-primary:hover { background: #4F46E5; }
    .btn-secondary { background: #E4E6EB; color: #050505; }
    .btn-secondary:hover { background: #D8DADE; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
    .badge-page { background: #E7F3FF; color: #6366F1; }
    .badge-post { background: #E8F5E9; color: #42B72A; }
    .badge-inbox { background: #FFF3E0; color: #F7B928; }
    .badge-insights { background: #F3E5F5; color: #9C27B0; }
    .badge-unknown { background: #F0F2F5; color: #65676B; }
    .section { margin-bottom: 8px; }
    .section-title { font-size: 11px; font-weight: 600; color: #65676B; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; padding: 0 2px; }
    .actions { display: flex; flex-direction: column; gap: 6px; }
    .footer { padding: 10px 16px; border-top: 1px solid #E4E6EB; display: flex; justify-content: space-between; font-size: 11px; color: #65676B; }
    .footer a { color: #6366F1; text-decoration: none; cursor: pointer; }
  
/* Synapse 1.2 unified compact popup */
:root{color-scheme:dark}body{width:344px!important;min-height:270px;background:#0b0d11!important;color:#f0f2f5!important;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif!important;font-size:13px} .header{padding:19px 18px!important;border-bottom:1px solid #292e37!important;gap:12px!important}.logo{background:#20232b!important;border:1px solid #383d46!important;color:#e87991!important;border-radius:6px!important;width:34px!important;height:34px!important;font-size:17px!important}.header h1{font-size:15px!important;font-weight:650!important;letter-spacing:-.025em}.status{color:#a8b0bd!important;font-size:11px!important}.dot{background:#4ad3a1!important}.body{padding:18px!important}.card{background:#12151b!important;border:1px solid #292e37!important;border-radius:7px!important;padding:13px!important;margin-bottom:19px!important}.avatar{background:#222732!important;color:#e87991!important;border-radius:6px!important}.card .name{color:#f0f2f5!important;font-size:13px!important}.card .sub{color:#a8b0bd!important;line-height:1.5!important}.section{margin-bottom:18px!important}.section-title{color:#8e99a8!important;letter-spacing:.11em!important;font-size:10px!important;margin-bottom:10px!important}.actions{gap:8px!important}.btn{border-radius:5px!important;padding:12px 14px!important;font-weight:600!important;min-height:43px!important}.btn-primary{background:#e87991!important;color:#101115!important}.btn-primary:hover{background:#f1a2b5!important}.btn-secondary{background:#1b2029!important;color:#f0f2f5!important;border:1px solid #343a45!important}.btn-secondary:hover{background:#292f39!important}.badge{border-radius:4px!important}.badge-page,.badge-post,.badge-inbox,.badge-insights,.badge-unknown{background:#242934!important;color:#d9a0b0!important}.footer{padding:14px 18px!important;border-top:1px solid #292e37!important;color:#a8b0bd!important;background:#0b0d11}.footer a{color:#e87991!important}button:focus-visible,a:focus-visible{outline:2px solid #e87991;outline-offset:2px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
  <div class="header">
    <div class="logo">S</div>
    <h1>Synapse AI</h1>
    <div class="status"><span class="dot"></span> Active</div>
  </div>

  <div class="body">
    <div class="card">
      <div class="avatar" id="page-avatar">P</div>
      <div class="info">
        <div class="name" id="page-name">Webpage</div>
        <div class="sub" id="page-status">Detecting page...</div>
      </div>
    </div>

    <div class="section" id="page-type-section">
      <div class="section-title">Current Page</div>
      <div id="page-type-display" style="margin-bottom:8px;"></div>
    </div>

    <div class="section">
      <div class="section-title">Actions</div>
      <div class="actions" id="actions-container">
        <button class="btn btn-primary" id="open-panel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          Open Side Panel
        </button>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>Synapse AI · v1.2.0</span>
    <a id="settings-link">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
